name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore Morphe signing keystore
        env:
          KS: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS" || { echo "MORPHE_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/morphe.p12"
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/morphe.p12
          STORE_PASSWORD: ${{ secrets.MORPHE_KEY_PASSWORD }}
          KEY_ALIAS: morphe
          KEY_PASSWORD: ${{ secrets.MORPHE_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Verify Morphe signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee signer-certs.txt
          grep -qi '0a8b609561f299eaba4518c57e558d506e3991bd0ac551cc167716241adad55f' signer-certs.txt
      - name: Name the asset
        run: cp app/build/outputs/apk/release/app-release.apk "CETC-Price-Calculator-${GITHUB_REF_NAME}.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "CETC-Price-Calculator-${GITHUB_REF_NAME}.apk" --title "CETC Price Calculator ${GITHUB_REF_NAME}" --generate-notes
